apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-config
  namespace: forgeflow
data:
  FORGEFLOW_FRONTEND_ORIGIN: "http://forgeflow.local"
  FORGEFLOW_WEBHOOK_BASE_URL: "http://forgeflow.local/api"
  JWT_EXPIRATION_MINUTES: "60"
  REDIS_HOST: forgeflow-redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: forgeflow-kafka:9092
  MINIO_ENDPOINT: http://forgeflow-minio:9000
  MINIO_BUCKET: forgeflow-artifacts
  OTEL_EXPORTER_OTLP_ENDPOINT: http://forgeflow-jaeger:4318
