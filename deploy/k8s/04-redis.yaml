apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-redis
  namespace: forgeflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: forgeflow-redis }
  template:
    metadata:
      labels: { app: forgeflow-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          ports: [{ containerPort: 6379 }]
          env:
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: REDIS_PASSWORD } } }
---
apiVersion: v1
kind: Service
metadata:
  name: forgeflow-redis
  namespace: forgeflow
spec:
  selector: { app: forgeflow-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
