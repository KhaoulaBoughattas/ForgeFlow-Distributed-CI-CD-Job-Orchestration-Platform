apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgeflow-kafka-pvc
  namespace: forgeflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-kafka
  namespace: forgeflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: forgeflow-kafka }
  template:
    metadata:
      labels: { app: forgeflow-kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - { containerPort: 9092 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://forgeflow-kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: forgeflow-kafka-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: forgeflow-kafka
  namespace: forgeflow
spec:
  selector: { app: forgeflow-kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
