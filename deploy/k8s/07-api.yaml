apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-api
  namespace: forgeflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: forgeflow-api }
  template:
    metadata:
      labels: { app: forgeflow-api }
    spec:
      containers:
        - name: api
          image: forgeflow-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: forgeflow-config }
          env:
            - { name: DB_URL, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: DB_PASSWORD } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: REDIS_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: JWT_SECRET } } }
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: MINIO_ROOT_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: forgeflow-api
  namespace: forgeflow
spec:
  selector: { app: forgeflow-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeflow-api-hpa
  namespace: forgeflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeflow-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
