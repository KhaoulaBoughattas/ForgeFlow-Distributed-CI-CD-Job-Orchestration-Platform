apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeflow-ingress
  namespace: forgeflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: forgeflow.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: forgeflow-api
                port: { number: 8080 }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: forgeflow-frontend
                port: { number: 80 }
