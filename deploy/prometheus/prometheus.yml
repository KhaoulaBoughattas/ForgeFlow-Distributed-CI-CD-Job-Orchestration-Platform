global:
  scrape_interval: 15s

scrape_configs:
  - job_name: forgeflow-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: forgeflow-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
